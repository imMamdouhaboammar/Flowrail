<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="flowrail-cyan-indigo" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="flowrail-accent" x1="24" y1="64" x2="104" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="flowrail-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Boundary Frame -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="#090D16" stroke="url(#flowrail-cyan-indigo)" stroke-width="3" />

  <!-- Parallel Rail Tracks (Corridors) -->
  <path d="M30 96 L52 32" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <path d="M98 96 L76 32" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Connecting Ties (Topological Gates) -->
  <path d="M36 80 L92 80" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="2 4" stroke-linecap="round" />
  <path d="M43 62 L85 62" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M50 44 L78 44" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Directional Stream / State Vector -->
  <path d="M64 94 L64 34" stroke="url(#flowrail-cyan-indigo)" stroke-width="4" stroke-linecap="round" filter="url(#flowrail-glow)" />

  <!-- Active Gate Nodes -->
  <circle cx="64" cy="94" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="64" cy="62" r="6" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="64" cy="34" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Cross-Corridor Fencing Pointers -->
  <path d="M56 34 L64 24 L72 34" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
