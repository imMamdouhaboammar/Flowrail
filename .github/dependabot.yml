version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      oxc:
        patterns:
          - "oxc*"
    ignore:
      - dependency-name: "oxc*"
        versions: ["> 0.38.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

